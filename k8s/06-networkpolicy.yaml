# Needs a network plugin that enforces policies (for example Calico).
# 1) Block all incoming traffic to every pod in the namespace.
# 2) Open only the paths the application needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pft
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-outside
  namespace: pft
spec:
  podSelector:
    matchLabels:
      app: web-gateway
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-recommendation-from-gateway
  namespace: pft
spec:
  podSelector:
    matchLabels:
      app: recommendation-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-gateway
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workout-from-gateway-and-recommendation
  namespace: pft
spec:
  podSelector:
    matchLabels:
      app: workout-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-gateway
        - podSelector:
            matchLabels:
              app: recommendation-service
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-workout
  namespace: pft
spec:
  podSelector:
    matchLabels:
      app: workout-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workout-service
      ports:
        - port: 27017
