# No "replicas" line on purpose: the autoscaler below owns the replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: pft
  labels:
    app: recommendation-service
spec:
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: noramaher/pft-recommendation:1.0   # replace noramaher with your Docker Hub name
          ports:
            - containerPort: 8000
          env:
            - name: WORKOUT_URL
              value: http://workout-service:8000
            - name: REDUCE_LOAD_MINUTES
              value: "300"
            - name: SIMULATE_CPU_MS      # stands in for heavy recommendation logic
              value: "50"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: pft
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendation-service
  namespace: pft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendation-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300; shorter so the demo shows it
