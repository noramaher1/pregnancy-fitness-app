<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregnancy fitness App</title>
<style>
  :root { --pink-50:#fff7f8; --pink-100:#fde7ea; --pink-200:#fad2da; --pink-300:#f1a1b1; --rose:#d1344f; --coral:#ee5f6e; --ink:#2f3a4f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color:var(--ink); background:var(--pink-50); }
  .hero { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; align-items:center; max-width:1100px; margin:0 auto; padding:0 24px; gap:24px; }
  .copy { padding:32px 0; }
  .kicker { font-size:2.2rem; font-weight:500; color:var(--pink-300); margin:0; }
  h1 { font-size:3.2rem; line-height:1.1; font-weight:700; color:var(--rose); margin:0 0 20px; }
  .caption { font-size:1.15rem; line-height:1.6; max-width:26ch; margin:0 0 28px; }
  .next { display:inline-block; background:var(--coral); color:#fff; text-decoration:none; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:14px 48px; border-radius:999px; font-size:.95rem; }
  .next:hover, .next:focus { background:#d94a5a; }
  .dots { display:flex; gap:10px; margin:28px 0 0; }
  .dots a { width:12px; height:12px; border-radius:50%; background:var(--pink-200); display:block; }
  .dots a.on { background:var(--coral); }
  .note { font-size:.8rem; color:#6b7280; margin-top:28px; max-width:40ch; }
  .art { display:flex; align-items:center; justify-content:center; }
  .art svg { width:100%; max-width:520px; height:auto; }
  @media (max-width:800px) {
    .hero { grid-template-columns:1fr; padding-top:16px; }
    .art { order:-1; }
    h1 { font-size:2.5rem; }
    .kicker { font-size:1.8rem; }
  }
</style>
</head>
<body>
<main class="hero">
  <section class="copy">
    <p class="kicker">Pregnancy</p>
    <h1>Fitness App</h1>
    <p class="caption">We help you do the right exercise for your week of pregnancy.</p>
    <a class="next" href="/app">Next</a>
    <div class="dots" aria-hidden="true"><a class="on" href="/"></a><a href="/app"></a></div>
    <p class="note">General information only. This is not medical advice. Ask your midwife or doctor before changing your exercise routine.</p>
  </section>
  <section class="art" aria-hidden="true">
    <svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
      <path d="M120 60C260 -10 470 40 500 200C530 360 430 500 280 510C130 520 20 420 30 280C40 170 60 100 120 60Z" fill="#fde0e5"/>

        <g transform="translate(70 430) rotate(-70)"><path d="M0 0C18-34 58-46 90-30C74 4 36 22 0 0Z"/></g>

        <g transform="translate(60 380) rotate(-95)"><path d="M0 0C18-34 58-46 90-30C74 4 36 22 0 0Z"/></g>

        <g transform="translate(445 200) rotate(-150)"><path d="M0 0C18-34 58-46 90-30C74 4 36 22 0 0Z"/></g>
      </g>
      <g transform="translate(50 55) scale(0.95)">
        <rect x="165" y="410" width="15" height="24" fill="#c98b6b"/>
        <rect x="203" y="410" width="15" height="24" fill="#c98b6b"/>
        <path d="M150 140C112 150 100 230 128 330C132 270 150 210 168 160Z" fill="#2f2a4a"/>
        <rect x="178" y="122" width="24" height="30" rx="8" fill="#c98b6b"/>
        <path d="M168 148C150 190 148 250 158 330L150 412H238L232 330C300 300 292 230 238 215C232 185 226 165 214 148Z" fill="#ef9a86"/>
        <circle cx="192" cy="92" r="38" fill="#c98b6b"/>

        <path transform="translate(70 120) scale(.7)" d="M0 8C-6-4-22 0-16 12C-12 20 0 28 0 28S12 20 16 12C22 0 6-4 0 8Z"/>
      </g>
    </svg>
  </section>
</main>
</body>
</html>
